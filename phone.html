<style>
/* charte JSI (JSI-DESIGN-SYSTEM) : fond #0D1014, panneaux #151A20, un seul accent jaune, coins 2 à 4 px */
:root{--bg:#0D1014;--panel:#151A20;--panel2:#1C222A;--ink:#E8ECF0;--ink2:#9AA6B3;--line:#2A323C;--line2:#3A4450;--accent:#F2B705;--accent-ink:#1B1500;--yel:#FDD619;--top:#0C0D0F;--ok:#4CC27F;--bad:#FF6B6B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{overscroll-behavior:none}
#tg{padding:6px 12px;background:var(--panel2);color:var(--ink);font-size:13px;border-bottom:1px solid var(--line);border-left:4px solid var(--accent);display:none;align-items:center;flex-wrap:wrap;gap:2px 14px}
#tg b.t{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:17px;font-weight:600;line-height:1.15}
#tg.none{border-left-color:var(--line2)}
#tg small{color:var(--ink2);font-size:12px}
#tg .chk{display:flex;gap:14px;margin-left:auto;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
#tg .chk span{color:var(--ink2)}#tg .chk span.ok{color:var(--ok)}#tg .chk span.nx{color:var(--yel)}
#foot{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--top);border-top:1px solid var(--line);min-height:46px}
#foot .nav{display:flex;gap:8px}
#foot .nav button,#pq .clr,#alt{white-space:nowrap;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:3px;padding:8px 4px;font:500 12px 'IBM Plex Sans','Segoe UI',system-ui,sans-serif}
#foot .nav button:active,#pq .clr:active,#alt:active{background:#262D36}
#pq{display:none;align-items:center;gap:8px;margin-left:auto;font-size:12.5px}
#pq b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:15px;font-weight:600;white-space:nowrap}
#pq .th{display:flex;gap:4px}
#pq img{height:34px;border-radius:2px;border:1px solid var(--line2)}
#tg.warn{background:#2a1618;border-left-color:var(--bad);color:var(--bad)}
#st{padding:calc(6px + env(safe-area-inset-top)) 12px 6px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:8px;background:var(--top);border-bottom:4px solid var(--accent)}
#st img{height:22px;width:22px;flex:none}
#st .ttl{white-space:nowrap;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:15px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;line-height:1}
#st .ttl{margin-right:8px}
#st .ttl b{color:var(--yel)}
#st .ver{margin-left:auto;white-space:nowrap;font-size:10px;color:var(--ink2);border:1px solid var(--line);border-radius:2px;padding:1px 5px}
#dot{width:8px;height:8px;border-radius:50%;background:#8A919C;flex:none}
#dot.ok{background:#3ECF6A}#dot.ko{background:var(--bad)}
#vw{flex:1;position:relative;min-height:0;background:#000}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px;line-height:1.5;color:var(--ink2)}
#bar{padding:14px 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;background:var(--top)}
#pqgo{display:none;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;padding:11px 6px;font:600 14px/1.15 'IBM Plex Sans','Segoe UI',system-ui,sans-serif}
#pqgo:active{background:#FFE55C}
#pqgo small{display:block;font-weight:500;font-size:11.5px}
#shut{width:76px;height:76px;border-radius:50%;border:5px solid var(--ink);background:var(--yel);cursor:pointer;padding:0}
#shut:active{transform:scale(.94)}
#shut:disabled{opacity:.45}
#alt{flex:none;width:100%}
#dbg{display:none;position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font:11px/1.35 monospace;color:var(--ink2);background:rgba(0,0,0,.55);word-break:break-all}
#cnt{font-size:12px;color:var(--ink2);text-align:center}
/* interface toujours en paysage : si le téléphone est tenu en portrait, elle est tournée de 90° */
body{display:grid;grid-template-columns:1fr 124px;grid-template-rows:100%;height:100%}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);padding-left:env(safe-area-inset-left)}
#bar{padding:14px calc(10px + env(safe-area-inset-right)) 14px 10px}
@media (orientation:portrait){
  html,body{overflow:hidden}
  body{position:fixed;top:0;left:0;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg)}
}

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const hs=(location.hash||'').replace(/^#/,'').split('.');
const id=(hs[0]||'').replace(/[^A-Za-z0-9_-]/g,'');
let cred=null;try{const t=atob((hs[1]||'').replace(/-/g,'+').replace(/_/g,'/')).split(':');if(t.length===2)cred={username:t[0],credential:t[1]}}catch(e){}
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.relay.metered.ca:80'}].concat(cred?[{urls:['turn:global.relay.metered.ca:80','turn:global.relay.metered.ca:80?transport=tcp','turn:global.relay.metered.ca:443','turns:global.relay.metered.ca:443?transport=tcp'],...cred}]:[]);
let target={rid:'',label:'',phase:'',j:false,o:false,fin:false},okT=null,conn=null,peer=null,stream=null,sent=0,retry=null,tmo=null,why={};
function dbg(k,v){why[k]=v;$('#dbg').textContent=Object.entries(why).map(([a,b])=>a+':'+b).join(' · ')}
const MAXW=2560,Q=.9;
let imgCap=null;
function status(t,k){$('#stt').textContent=t;$('#dot').className=k||''}
function msg(t){const m=$('#msg');m.textContent=t||'';m.style.display=t?'flex':'none'}
function tgShow(){
  const e=$('#tg');e.style.display=conn&&conn.open?'flex':'none';
  const nav='';
  if(target.fin){e.className='';e.innerHTML='<b class="t">Phase terminée&nbsp;✔</b><small>Choisissez une autre étape sur le PC</small>'+nav}
  else if(target.rid){e.className='';
    const nx=!target.j?'j':!target.o?'o':'';
    e.innerHTML='<b class="t">'+esc(target.label)+'</b>'+(target.phase?'<small>'+esc(target.phase)+'</small>':'')
      +'<div class="chk"><span class="'+(target.j?'ok':nx==='j'?'nx':'')+'">'+(target.j?'✔':'①')+' Page Jacking</span><span class="'+(target.o?'ok':nx==='o'?'nx':'')+'">'+(target.o?'✔':'②')+' Page Overview</span></div>'+nav}
  else{e.className='none';e.innerHTML='<b class="t">Aucune étape choisie</b><small>Choisissez une étape sur le PC ou avec les boutons ci-dessous</small>'+nav}
  const go=m=>()=>{if(conn&&conn.open)conn.send({t:m})};
  $('#pvb').onclick=go('prev');$('#nxb').onclick=go('next')
}
/* photos prises en attente : on enchaîne les prises sans attendre le PC, puis un seul envoi */
const pq=[];
function pqShow(){
  const e=$('#pq'),g=$('#pqgo');e.style.display=pq.length?'flex':'none';g.style.display=pq.length?'block':'none';
  if(!pq.length){e.innerHTML='';return}
  g.innerHTML='Envoyer au PC<small>('+pq.length+' photo'+(pq.length>1?'s':'')+')</small>';
  e.innerHTML='<b>'+pq.length+' prête'+(pq.length>1?'s':'')+'</b><span class="th">'+pq.map(x=>'<img src="'+x.url+'" alt="">').join('')+'</span><button class="clr" id="pqno" type="button">Effacer</button>';
  $('#pqno').onclick=()=>{pq.splice(0).forEach(x=>URL.revokeObjectURL(x.url));pqShow()}
}
async function pqSend(){
  if(!pq.length)return;
  if(!(conn&&conn.open)){status('PC non connecté','ko');return}
  const it=pq.splice(0);pqShow();
  for(const x of it){await send(x.b,x.rid);URL.revokeObjectURL(x.url)}
}
const esc=x=>String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ready(){tgShow();$('#shut').disabled=!(conn&&conn.open)}

async function cam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:4096},height:{ideal:2160}},audio:false});
    /* évite l'objectif ultra grand-angle : on préfère l'appareil arrière principal */
    try{
      const cur=stream.getVideoTracks()[0],ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
      const bad=/ultra|wide|grand|0\.5/i,back=/back|rear|arri|environment/i;
      dbg('cam',(cur.label||'?').slice(0,28));
      if(bad.test(cur.label||'')){
        const alt=ds.find(d=>back.test(d.label)&&!bad.test(d.label));
        if(alt){stream.getTracks().forEach(x=>x.stop());stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:alt.deviceId},width:{ideal:4096},height:{ideal:2160}},audio:false});dbg('cam',(alt.label||'?').slice(0,28))}
      }
    }catch(e){}
    const v=$('#v');v.srcObject=stream;await v.play().catch(()=>{});msg('');
    const tr=stream.getVideoTracks()[0];
    try{await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    try{if(window.ImageCapture)imgCap=new ImageCapture(tr)}catch(e){}
  }catch(e){
    msg('Appareil photo bloqué dans le navigateur. Autorisez la caméra pour ce site, ou utilisez le bouton ci-dessous.');
    $('#alt').hidden=false;
  }
  try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{})});

async function frameBlob(){
  /* photo native en pleine résolution quand le navigateur la propose (bien plus nette qu'une image de la vidéo) */
  if(imgCap&&imgCap.takePhoto){try{const b=await imgCap.takePhoto();if(b&&b.size)return await fileBlob(b,true)}catch(e){}}
  return videoBlob()
}
function videoBlob(){
  const v=$('#v');if(!stream||!v.videoWidth)return Promise.resolve(null);
  return drawBlob(v,v.videoWidth,v.videoHeight,'video')
}
/* téléphone tourné en paysage mais image de la caméra restée en portrait : on la remet droite */
function drawBlob(src,w,h,tag){
  const k=Math.min(1,MAXW/Math.max(w,h)),c=document.createElement('canvas');
  const ang=((screen.orientation&&screen.orientation.angle)!=null?screen.orientation.angle:(window.orientation||0)+360)%360;
  const rot=(ang===90||ang===270)&&h>w?(ang===270?Math.PI/2:-Math.PI/2):0;
  dbg('img',tag+' '+w+'x'+h+' ecran '+ang+(rot?' rot':' sans-rot'));
  const cw=Math.round(w*k),ch=Math.round(h*k),x=c.getContext('2d');
  if(rot){c.width=ch;c.height=cw;x.translate(c.width/2,c.height/2);x.rotate(rot);x.drawImage(src,-cw/2,-ch/2,cw,ch)}
  else{c.width=cw;c.height=ch;x.drawImage(src,0,0,cw,ch)}
  return new Promise(ok=>c.toBlob(ok,'image/jpeg',Q));
}
async function fileBlob(f,cam){
  const bmp=await createImageBitmap(f,{imageOrientation:'from-image'}).catch(()=>null);if(!bmp)return f;
  if(cam)return drawBlob(bmp,bmp.width,bmp.height,'photo');
  const k=Math.min(1,MAXW/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(ok=>c.toBlob(ok,'image/jpeg',Q));
}
async function send(b,rid){
  if(!b){status('Photo impossible','ko');return}
  if(!(conn&&conn.open)){status('PC non connecté','ko');return}
  const buf=await b.arrayBuffer();
  conn.send({t:'photo',mime:'image/jpeg',buf,rid:(rid!=null&&rid!==''?rid:target.rid)||''});sent++;$('#cnt').textContent=sent+' envoyée'+(sent>1?'s':'');
  
}
let pend='',busy=false;
function flash(){const f=$('#flash');f.style.opacity=.85;setTimeout(()=>f.style.opacity=0,120);if(navigator.vibrate)navigator.vibrate(40)}
function stock(b,rid){pq.push({b,rid:rid||'',url:URL.createObjectURL(b)});flash();pqShow()}
/* demande du PC (ancien bouton) : envoi immédiat ; bouton du téléphone : la photo est gardée en attente */
async function shoot(rid){pend=rid||'';const b=await frameBlob();if(b)return send(b,pend);if(!$('#alt').hidden)$('#fi').click()}
async function take(){
  if(busy)return;busy=true;$('#shut').disabled=true;
  try{const b=await frameBlob();if(b)stock(b,target.rid);else if(!$('#alt').hidden){pend=target.rid;$('#fi').click()}}finally{busy=false;ready()}
}
$('#shut').onclick=take;
$('#pqgo').onclick=pqSend;
$('#alt').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f){const b=await fileBlob(f);if(b)stock(b,pend)}};

function connect(){
  if(!id){status('Lien invalide : scannez à nouveau le QR code','ko');return}
  clearTimeout(retry);status('Connexion au PC…');
  if(peer)try{peer.destroy()}catch(e){}
  peer=new Peer({config:{iceServers:ICE}});dbg('signal','…');dbg('relais',cred?'oui':'non');
  peer.on('open',()=>{
    dbg('signal','ok');
    conn=peer.connect(id,{serialization:'binary',reliable:true});
    clearTimeout(tmo);tmo=setTimeout(()=>{if(!(conn&&conn.open)){status('Pas de réponse du PC : réseau bloqué ? (même Wi-Fi, pas de réseau invités)','ko');dbg('ice',conn&&conn.peerConnection?conn.peerConnection.iceConnectionState:'?')}},20000);
    const pc=conn.peerConnection;if(pc){pc.addEventListener('iceconnectionstatechange',()=>dbg('ice',pc.iceConnectionState));
      const n={host:0,srflx:0,relay:0};pc.addEventListener('icecandidate',e=>{const c=e.candidate;if(!c)return;n[c.type]=(n[c.type]||0)+1;dbg('cand','h'+n.host+' s'+n.srflx+' r'+n.relay+(/\.local/.test(c.address||c.candidate)?' mdns':''))})}
    conn.on('open',()=>{fails=0;clearTimeout(tmo);status('Connecté au PC','ok');ready();conn.send({t:'ready'})});
    conn.on('data',d=>{if(!d)return;
      if(d.t==='shoot')shoot(d.rid);
      else if(d.t==='target'){target={rid:d.rid||'',label:d.label||'',phase:d.phase||'',j:!!d.j,o:!!d.o,fin:!!d.fin};tgShow()}
      else if(d.t==='warn'){const e=$('#tg');e.className='warn';e.innerHTML=esc(d.msg||'Photo non lisible');clearTimeout(okT);okT=setTimeout(tgShow,3500)}
      else if(d.t==='saved'){const e=$('#tg');e.className='';e.innerHTML='<b class="t">Photo enregistrée&nbsp;✔</b>'+(target.rid?'<small>'+esc(target.label)+'</small>':'');clearTimeout(okT);okT=setTimeout(tgShow,3500)}});
    conn.on('close',lost);conn.on('error',lost);
  });
  peer.on('error',e=>{dbg('err',e&&e.type||e);if(e&&e.type==='peer-unavailable'){status('PC introuvable (QR code périmé ?) : nouvelle tentative…','ko');clearTimeout(retry);if(fails<8)retry=setTimeout(connect,Math.min(60000,3000*Math.pow(2,fails++)))}else lost()});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
}
let fails=0;
function lost(){
  ready();clearTimeout(retry);
  if(fails>=8){status('Serveur de connexion indisponible ou trop sollicité : réessayez dans quelques minutes (scannez un nouveau QR code)','ko');return}
  status('Connexion perdue, nouvelle tentative…','ko');retry=setTimeout(connect,Math.min(60000,2500*Math.pow(2,fails++)))
}
/* paysage imposé : verrouillage quand le navigateur le permet (Android) ; sinon l'interface est tournée par le CSS et l'aperçu caméra remis à l'endroit ici */
async function lockLand(){
  /* plein écran (Android / Chrome ; absent sur iPhone) puis verrouillage en paysage */
  try{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)await d.requestFullscreen({navigationUI:'hide'})}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){}
}
document.addEventListener('pointerdown',lockLand,{once:true});
