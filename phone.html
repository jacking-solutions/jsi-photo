<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Photo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0c0d0f;color:#f2f3f5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column;overscroll-behavior:none}
#tg{padding:8px 14px;background:#10331f;color:#c9f5d9;font-size:15px;font-weight:600;border-bottom:1px solid #1f6b3e;display:none}
#tg.none{background:#2a2410;color:#f5e3a4;border-color:#6b5a1f;font-weight:500}
#tg small{display:block;font-weight:400;opacity:.8;font-size:12px}
#tg .chk{display:flex;gap:14px;margin-top:6px;font-size:13px;font-weight:600}
#tg .chk span{opacity:.55}#tg .chk span.ok{opacity:1;color:#7bf0a5}#tg .chk span.nx{opacity:1;color:#fff;text-decoration:underline}
#tg .nxb{margin-top:8px;background:none;border:1px solid #3a7a52;color:#c9f5d9;border-radius:6px;padding:6px 10px;font-size:13px}
#tg.warn{background:#3a1414;color:#ffb4b4;border-color:#7a2a2a}
#st{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-size:14px;display:flex;align-items:center;gap:8px;background:#16181c;border-bottom:1px solid #2a2d33}
#dot{width:10px;height:10px;border-radius:50%;background:#e0a100;flex:none}
#dot.ok{background:#3ecf6a}#dot.ko{background:#e5484d}
#vw{flex:1;position:relative;min-height:0;background:#000}
video{width:100%;height:100%;object-fit:cover;display:block}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px;line-height:1.5;color:#c6cad1}
#bar{padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:18px;background:#16181c}
#shut{width:76px;height:76px;border-radius:50%;border:5px solid #f2f3f5;background:#ffd21f;cursor:pointer;padding:0}
#shut:active{transform:scale(.94)}
#shut:disabled{opacity:.35}
#alt{background:none;border:1px solid #3a3e46;color:#c6cad1;border-radius:6px;padding:9px 12px;font-size:13px}
#dbg{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font:11px/1.35 monospace;color:#9aa0a9;background:rgba(0,0,0,.55);word-break:break-all}
#cnt{font-size:13px;color:#9aa0a9;min-width:70px;text-align:center}
#side{display:contents}
/* paysage : vidéo en grand au centre, infos à gauche, déclencheur à droite */
@media (orientation:landscape) and (max-height:560px){
  body{display:grid;grid-template-columns:minmax(190px,32%) 1fr 104px;grid-template-rows:100%;height:100%}
  #side{display:flex;flex-direction:column;overflow:auto;background:#16181c;padding-left:env(safe-area-inset-left)}
  #st{padding-top:10px}
  #vw{grid-column:2}
  #bar{flex-direction:column;padding:14px calc(10px + env(safe-area-inset-right)) 14px 10px;justify-content:center}
}
</style></head><body>
<div id="side"><div id="st"><span id="dot"></span><span id="stt">Connexion…</span></div>
<div id="tg"></div></div>
<div id="vw"><video id="v" playsinline muted autoplay></video><div id="flash"></div><div id="dbg"></div><div id="msg">Ouverture de l’appareil photo…</div></div>
<div id="bar"><button id="alt" type="button" hidden>Appareil photo du téléphone</button><button id="shut" type="button" aria-label="Prendre la photo" disabled></button><span id="cnt"></span></div>
<input id="fi" type="file" accept="image/*" capture="environment" hidden>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const hs=(location.hash||'').replace(/^#/,'').split('.');
const id=(hs[0]||'').replace(/[^A-Za-z0-9_-]/g,'');
let cred=null;try{const t=atob((hs[1]||'').replace(/-/g,'+').replace(/_/g,'/')).split(':');if(t.length===2)cred={username:t[0],credential:t[1]}}catch(e){}
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.relay.metered.ca:80'}].concat(cred?[{urls:['turn:global.relay.metered.ca:80','turn:global.relay.metered.ca:80?transport=tcp','turn:global.relay.metered.ca:443','turns:global.relay.metered.ca:443?transport=tcp'],...cred}]:[]);
let target={rid:'',label:'',phase:'',j:false,o:false,fin:false},okT=null,conn=null,peer=null,stream=null,sent=0,retry=null,tmo=null,why={};
function dbg(k,v){why[k]=v;$('#dbg').textContent=Object.entries(why).map(([a,b])=>a+':'+b).join(' · ')}
const MAXW=2560,Q=.9;
let imgCap=null;
function status(t,k){$('#stt').textContent=t;$('#dot').className=k||''}
function msg(t){const m=$('#msg');m.textContent=t||'';m.style.display=t?'flex':'none'}
function tgShow(){
  const e=$('#tg');e.style.display=conn&&conn.open?'block':'none';
  if(target.fin){e.className='';e.innerHTML='Phase terminée ✔<small>Choisissez une autre étape sur le PC</small>'}
  else if(target.rid){e.className='';
    const nx=!target.j?'j':!target.o?'o':'';
    e.innerHTML='Photo pour : '+esc(target.label)+(target.phase?'<small>'+esc(target.phase)+'</small>':'')
      +'<div class="chk"><span class="'+(target.j?'ok':nx==='j'?'nx':'')+'">'+(target.j?'✔':'①')+' Page Jacking</span><span class="'+(target.o?'ok':nx==='o'?'nx':'')+'">'+(target.o?'✔':'②')+' Page Overview</span></div>'
      +'<button class="nxb" id="nxb" type="button">Étape suivante ›</button>';
    const b=$('#nxb');if(b)b.onclick=()=>{if(conn&&conn.open)conn.send({t:'next'})}}
  else{e.className='none';e.innerHTML='Aucune étape choisie<small>Photo seule : choisissez une étape sur le PC pour l’analyser</small>'}
}
const esc=x=>String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ready(){tgShow();$('#shut').disabled=!(conn&&conn.open)}

async function cam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:4096},height:{ideal:2160}},audio:false});
    /* évite l'objectif ultra grand-angle : on préfère l'appareil arrière principal */
    try{
      const cur=stream.getVideoTracks()[0],ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
      const bad=/ultra|wide|grand|0\.5/i,back=/back|rear|arri|environment/i;
      dbg('cam',(cur.label||'?').slice(0,28));
      if(bad.test(cur.label||'')){
        const alt=ds.find(d=>back.test(d.label)&&!bad.test(d.label));
        if(alt){stream.getTracks().forEach(x=>x.stop());stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:alt.deviceId},width:{ideal:4096},height:{ideal:2160}},audio:false});dbg('cam',(alt.label||'?').slice(0,28))}
      }
    }catch(e){}
    const v=$('#v');v.srcObject=stream;await v.play().catch(()=>{});msg('');
    const tr=stream.getVideoTracks()[0];
    try{await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    try{if(window.ImageCapture)imgCap=new ImageCapture(tr)}catch(e){}
  }catch(e){
    msg('Appareil photo bloqué dans le navigateur. Autorisez la caméra pour ce site, ou utilisez le bouton ci-dessous.');
    $('#alt').hidden=false;
  }
  try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{})});

async function frameBlob(){
  /* photo native en pleine résolution quand le navigateur la propose (bien plus nette qu'une image de la vidéo) */
  if(imgCap&&imgCap.takePhoto){try{const b=await imgCap.takePhoto();if(b&&b.size)return await fileBlob(b)}catch(e){}}
  return videoBlob()
}
function videoBlob(){
  const v=$('#v');if(!stream||!v.videoWidth)return Promise.resolve(null);
  const w=v.videoWidth,h=v.videoHeight,k=Math.min(1,MAXW/Math.max(w,h)),c=document.createElement('canvas');
  /* téléphone tourné en paysage mais image de la caméra restée en portrait : on la remet droite */
  const ang=((screen.orientation&&screen.orientation.angle)!=null?screen.orientation.angle:(window.orientation||0)+360)%360;
  const rot=(ang===90||ang===270)&&h>w?(ang===270?Math.PI/2:-Math.PI/2):0;
  dbg('img',w+'x'+h+' ecran '+ang+' fen '+innerWidth+'x'+innerHeight+(rot?' rot':' sans-rot'));
  const cw=Math.round(w*k),ch=Math.round(h*k),x=c.getContext('2d');
  if(rot){c.width=ch;c.height=cw;x.translate(c.width/2,c.height/2);x.rotate(rot);x.drawImage(v,-cw/2,-ch/2,cw,ch)}
  else{c.width=cw;c.height=ch;x.drawImage(v,0,0,cw,ch)}
  return new Promise(ok=>c.toBlob(ok,'image/jpeg',Q));
}
async function fileBlob(f){
  const bmp=await createImageBitmap(f,{imageOrientation:'from-image'}).catch(()=>null);if(!bmp)return f;
  const k=Math.min(1,MAXW/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(ok=>c.toBlob(ok,'image/jpeg',Q));
}
async function send(b,rid){
  if(!b){status('Photo impossible','ko');return}
  if(!(conn&&conn.open)){status('PC non connecté','ko');return}
  const buf=await b.arrayBuffer();
  conn.send({t:'photo',mime:'image/jpeg',buf,rid:(rid!=null&&rid!==''?rid:target.rid)||''});sent++;$('#cnt').textContent=sent+' photo'+(sent>1?'s':'');
  const f=$('#flash');f.style.opacity=.85;setTimeout(()=>f.style.opacity=0,120);
  if(navigator.vibrate)navigator.vibrate(40);
}
let pend='';
async function shoot(rid){pend=rid||'';const b=await frameBlob();if(b)return send(b,pend);if(!$('#alt').hidden)$('#fi').click()}
$('#shut').onclick=()=>shoot('');
$('#alt').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)send(await fileBlob(f),pend)};

function connect(){
  if(!id){status('Lien invalide : scannez à nouveau le QR code','ko');return}
  clearTimeout(retry);status('Connexion au PC…');
  if(peer)try{peer.destroy()}catch(e){}
  peer=new Peer({config:{iceServers:ICE}});dbg('signal','…');dbg('relais',cred?'oui':'non');
  peer.on('open',()=>{
    dbg('signal','ok');
    conn=peer.connect(id,{serialization:'binary',reliable:true});
    clearTimeout(tmo);tmo=setTimeout(()=>{if(!(conn&&conn.open)){status('Pas de réponse du PC : réseau bloqué ? (même Wi-Fi, pas de réseau invités)','ko');dbg('ice',conn&&conn.peerConnection?conn.peerConnection.iceConnectionState:'?')}},20000);
    const pc=conn.peerConnection;if(pc){pc.addEventListener('iceconnectionstatechange',()=>dbg('ice',pc.iceConnectionState));
      const n={host:0,srflx:0,relay:0};pc.addEventListener('icecandidate',e=>{const c=e.candidate;if(!c)return;n[c.type]=(n[c.type]||0)+1;dbg('cand','h'+n.host+' s'+n.srflx+' r'+n.relay+(/\.local/.test(c.address||c.candidate)?' mdns':''))})}
    conn.on('open',()=>{fails=0;clearTimeout(tmo);status('Connecté au PC','ok');ready();conn.send({t:'ready'})});
    conn.on('data',d=>{if(!d)return;
      if(d.t==='shoot')shoot(d.rid);
      else if(d.t==='target'){target={rid:d.rid||'',label:d.label||'',phase:d.phase||'',j:!!d.j,o:!!d.o,fin:!!d.fin};tgShow()}
      else if(d.t==='warn'){const e=$('#tg');e.className='warn';e.innerHTML=esc(d.msg||'Photo non lisible');clearTimeout(okT);okT=setTimeout(tgShow,3500)}
      else if(d.t==='saved'){const e=$('#tg');e.className='';e.innerHTML='Photo enregistrée ✔'+(target.rid?'<small>'+esc(target.label)+'</small>':'');clearTimeout(okT);okT=setTimeout(tgShow,3500)}});
    conn.on('close',lost);conn.on('error',lost);
  });
  peer.on('error',e=>{dbg('err',e&&e.type||e);if(e&&e.type==='peer-unavailable'){status('PC introuvable (QR code périmé ?) : nouvelle tentative…','ko');clearTimeout(retry);if(fails<8)retry=setTimeout(connect,Math.min(60000,3000*Math.pow(2,fails++)))}else lost()});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
}
let fails=0;
function lost(){
  ready();clearTimeout(retry);
  if(fails>=8){status('Serveur de connexion indisponible ou trop sollicité : réessayez dans quelques minutes (scannez un nouveau QR code)','ko');return}
  status('Connexion perdue, nouvelle tentative…','ko');retry=setTimeout(connect,Math.min(60000,2500*Math.pow(2,fails++)))
}
dbg('page','1.7.7');cam();connect();
</script></body></html>
